<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkulGo — Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">S</div>
        <div>
          <strong>SkulGo</strong>
          <span>Admin</span>
        </div>
      </div>
      <nav aria-label="Admin navigation">
        <button class="nav-item active" data-section="school">School</button>
        <button class="nav-item" data-section="students">Students</button>
        <button class="nav-item" data-section="classes">Classes</button>
        <button class="nav-item" data-section="subjects">Subjects</button>
        <button class="nav-item" data-section="teachers">Teachers</button>
        <button class="nav-item" data-section="assignments">Teaching Assignments</button>
        <button class="nav-item" data-section="attendance">Attendance</button>
        <button class="nav-item" data-section="results">Results</button>
        <button class="nav-item" data-section="report-card">Report Card</button>
      </nav>
      <div class="sidebar-footer"><span class="status-dot"></span><span>Offline ready</span></div>
    </aside>
    <main class="content">
      <header class="topbar">
        <div><p class="eyebrow">School authority workspace</p><h1 id="page-title">School</h1></div>
        <div class="connection"><span class="status-dot"></span><span>Local</span></div>
      </header>
      <section id="page" class="panel" aria-live="polite">
        <h2>School setup</h2>
        <p class="muted">Manage the school's identity and current academic period.</p>
        <div class="info-grid">
          <div class="info-card"><span>School</span><strong>Your school</strong></div>
          <div class="info-card"><span>Academic session</span><strong>Not configured</strong></div>
          <div class="info-card"><span>Current term</span><strong>Not configured</strong></div>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js?v=20261004-inactive-hidden"></script>
  <script src="/revenue.js?v=20261004-revenue-v1"></script>
</body>
</html>
