name: Deploy SkulGo Offline Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static install site
        run: |
          rm -rf site
          mkdir -p site/admin site/teacher
          cp -R apps/admin/. site/admin/
          cp -R apps/teacher/. site/teacher/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>SkulGo Offline</title>
            <style>body{font-family:system-ui,sans-serif;max-width:720px;margin:60px auto;padding:24px}a{display:block;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:12px;text-decoration:none}</style>
          </head>
          <body>
            <h1>SkulGo Offline</h1>
            <p>Install the workspace you need. Complete the first load while online, then the app shell can work offline.</p>
            <a href="./admin/">Install / open Admin</a>
            <a href="./teacher/">Install / open Teacher</a>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
